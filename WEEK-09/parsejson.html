<!DOCTYPE html>
<html>
<head>
    <title>Bakery Hub - JSON/XML</title>
</head>

<body>

<h2>🍰 Bakery Hub</h2>

<button onclick="loadJSON()">Load JSON</button>
<button onclick="loadXML()">Load XML</button>

<div id="output"></div>

<script>

function loadJSON() {
    fetch("products.json")
    .then(res => res.json())
    .then(data => {
        let html = "<h3>JSON Products</h3>";
        data.forEach(p => {
            html += `<p>${p.name} - ₹${p.price}</p>`;
        });
        document.getElementById("output").innerHTML = html;
    });
}

function loadXML() {
    fetch("bakerydata.xml")
    .then(res => res.text())
    .then(data => {
        let xml = new DOMParser().parseFromString(data, "text/xml");
        let products = xml.getElementsByTagName("product");
        let html = "<h3>XML Products</h3>";

        for (let p of products) {
            let name = p.getElementsByTagName("name")[0].textContent;
            let price = p.getElementsByTagName("price")[0].textContent;
            html += `<p>${name} - ₹${price}</p>`;
        }

        document.getElementById("output").innerHTML = html;
    });
}

</script>

</body>
</html>
