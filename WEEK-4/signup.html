<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bakery Hub - Sign Up</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Internal CSS -->
    <style>
      .signup-title {
        text-align: center;
        margin-top: 30px;
      }

      .signup-description {
        text-align: center;
        font-size: 16px;
      }

      .required {
        color: red;
      }
    </style>
  </head>

  <body>
    <nav>
      <a href="home.html">Home</a> | <a href="login.html">Login</a> |
      <a href="signup.html">Sign Up</a>
    </nav>

    <h1 class="signup-title">Create Your Bakery Hub Account</h1>

    <p class="signup-description">
      Register with Bakery Hub to explore our delicious products.
    </p>

    <form onsubmit="return validateForm()">
      <label for="fname"> First Name <span class="required">*</span> </label>

      <input type="text" id="fname" name="fname" />

      <label for="lname"> Last Name <span class="required">*</span> </label>

      <input type="text" name="lname" id="lname" />

      <label for="email"> Email <span class="required">*</span> </label>

      <input type="email" name="email" id="email" />

      <label for="username"> Username <span class="required">*</span> </label>

      <input type="text" name="username" id="username" />

      <label for="password"> Password <span class="required">*</span> </label>

      <input type="password" name="password" id="password" />

      <label for="cpassword">
        Confirm Password <span class="required">*</span>
      </label>

      <input type="password" name="cpassword" id="cpassword" />

      <!-- Inline CSS -->
      <button type="submit" style="width: 100%; margin-top: 15px">
        Sign Up
      </button>
    </form>
    <script src="validation.js"></script>
  </body>
</html>
